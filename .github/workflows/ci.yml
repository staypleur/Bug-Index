name: Bug Index checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock pytest==9.0.2
      - name: Install libraries for actual traceback checks
        run: pip install numpy==2.2.6 pandas==2.3.3
      - run: python -m scripts.build_catalog --check
      - name: Require C and Java compilers for runtime diagnostics
        run: |
          gcc --version
          javac -version
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test extension/*.test.js
      - run: node --check extension/extension.js && node --check web/app.js
      - run: docker build -t bug-index:ci .
